plugins {
	id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {url "https://api.modrinth.com/maven" }
	maven {url "https://maven.terraformersmc.com/" }
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven {url "https://maven.isxander.dev/releases"}
	maven { url 'https://maven.wispforest.io/releases/' }
	maven { url 'https://jitpack.io' }
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	/* Change versions in gradle.properties */

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation("com.terraformersmc:modmenu:${project.modmenu_version}")

	implementation "io.wispforest:owo-lib:${project.owo_version}"
	include "io.wispforest:owo-sentinel:${project.owo_version}"

	// Not bundled: downloaded at runtime by OnnxRuntimeBootstrap (checksum-pinned)
	// to keep the shipped mod jar small. localRuntime keeps it on the dev runtime
	// classpath so `runClient` works without the download.
	compileOnly "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"
	localRuntime "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"

	// Dev-only runtime dependency (loaded during `runClient` testing, not bundled or required in release JAR)
	localRuntime "maven.modrinth:fBXt3AlC:fbk5CTBF"

	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {

	}
}